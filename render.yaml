# P.E.T.E.R. — Render Blueprint
# One web service that serves the PWA + API + runs the Peter worker.
# Deploy: push this repo to GitHub, then in Render click
#   "New -> Blueprint" and point it at this repo (it auto-reads render.yaml).
#
# After deploy, set the 5 secret env vars (LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
# GOOGLE_API_KEY, SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET) in the Render
# dashboard, then register the /spotify/callback redirect URI in Spotify.
# The Spotify redirect URI and public URL are auto-derived from the request,
# so there are NO placeholders to edit here.

services:
  - type: web
    name: peter
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # LiveKit (same keys as your local .env)
      - key: LIVEKIT_URL
        value: wss://project-p-e-t-e-r-b7e84u03.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false            # set in the Render dashboard (secret)
      - key: LIVEKIT_API_SECRET
        sync: false
      # Google AI / Gemini Realtime (required for speech)
      - key: GOOGLE_API_KEY
        sync: false
      # Agent name (must match your LiveKit agent deployment)
      - key: AGENT_ID
        value: peter-assistant
# Spotify (set client id/secret as secrets in the dashboard)
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Optional: set MEM0_API_KEY for persistent cloud memory across
      # redeploys (local ./memory_store is ephemeral on free Render).
      - key: MEM0_API_KEY
        sync: false
      # Render injects PORT=10000 automatically; the backend reads it below.
      # NOTE: SPOTIFY_REDIRECT_URI and PUBLIC_URL are AUTO-DERIVED from the
      # request URL at runtime, so you do NOT need to set them. You only need
      # to register the redirect URI once in the Spotify dashboard (see
      # DEPLOY_CLOUD.md).
      - key: PORT
        value: 10000
