# P.E.T.E.R. — Render Blueprint
# TWO services that together serve the PWA + API + run the Peter voice worker:
#
#   1. `peter`        (web)    -> serves the phone UI + backend API (mobile_backend.py)
#   2. `peter-worker` (worker) -> runs the LiveKit agent (agent.py) that Peter's
#                                 voice actually comes from.
#
# This is the standard, RELIABLE LiveKit deployment pattern. The worker is a
# first-class process that Render restarts automatically if it crashes — far
# more reliable than trying to spawn it as a child of the web process.
#
# Deploy: push this repo to GitHub, then on render.com click
#   "New -> Blueprint" and select the repo. It auto-reads this file.
# Then set the 5 secret env vars (see below) in BOTH services' dashboards.

services:
  # ── Web: the phone-facing app (UI + API + token endpoint) ─────────────
  - type: web
    name: peter
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # Web service runs the FastAPI backend (serves UI + API + tokens).
    # EMBEDDED_WORKER=0 stops the backend from also spawning a child worker —
    # the dedicated worker service below is the one that runs agent.py.
    startCommand: python mobile_backend.py
    envVars:
      - key: EMBEDDED_WORKER
        value: "0"
      # LiveKit
      - key: LIVEKIT_URL
        value: wss://project-p-e-t-e-r-b7e84u03.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Google AI / Gemini Realtime (required for speech)
      - key: GOOGLE_API_KEY
        sync: false
      # Agent name (must match the worker's agent, default peter-assistant)
      - key: AGENT_ID
        value: peter-assistant
      # Spotify (set client id/secret as secrets)
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Render injects PORT automatically; backend reads it.
      - key: PORT
        value: 10000

  # ── Worker: the LiveKit agent that actually talks to Peter ────────────
  - type: worker
    name: peter-worker
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    # The worker runs the LiveKit agent that joins the room and speaks.
    startCommand: python agent.py dev
    envVars:
      # LiveKit
      - key: LIVEKIT_URL
        value: wss://project-p-e-t-e-r-b7e84u03.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Google AI / Gemini Realtime (required for speech)
      - key: GOOGLE_API_KEY
        sync: false
      # Agent name — must match the name used in the token dispatch.
      - key: AGENT_ID
        value: peter-assistant
      # Optional: Mem0 cloud memory so Peter remembers you across redeploys.
      - key: MEM0_API_KEY
        sync: false
