# P.E.T.E.R. — Render Blueprint
#
# SINGLE web service that runs BOTH the phone-facing backend AND the Peter
# voice worker inside the same container. This is required for Render's FREE
# tier, which does NOT keep Background Worker services alive.
#
# The web process (python mobile_backend.py) starts UVICORN for the API and
# ALSO launches the Peter voice worker (python agent.py dev) as a managed
# child process. If that child crashes, the backend automatically restarts it
# and exposes /health + /worker-log so you can see exactly what's wrong.
#
# Deploy: push this repo to GitHub, then on render.com click
#   "New -> Blueprint" and select the repo. It auto-reads this file.
# Then set the secret env vars (see below) in the Service -> Environment tab.

services:
  - type: web
    name: peter
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # Runs the FastAPI backend, which in turn starts (and keeps alive) the
    # embedded Peter voice worker. Must stay EMBEDDED_WORKER=1 on Render free.
    startCommand: python mobile_backend.py
    envVars:
      # Keep the voice worker running inside this same web container.
      - key: EMBEDDED_WORKER
        value: "1"
      # LiveKit
      - key: LIVEKIT_URL
        value: wss://project-p-e-t-e-r-b7e84u03.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false        # SET THIS in the Render dashboard (secret)
      - key: LIVEKIT_API_SECRET
        sync: false        # SET THIS in the Render dashboard (secret)
      # Google AI / Gemini Realtime (REQUIRED — without it Peter cannot speak)
      - key: GOOGLE_API_KEY
        sync: false        # SET THIS in the Render dashboard (secret)
      # Agent name (must match the token dispatch)
      - key: AGENT_ID
        value: peter-assistant
      # Spotify (optional — only needed for "play my music")
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Optional: Mem0 cloud memory so Peter remembers you across redeploys.
      - key: MEM0_API_KEY
        sync: false
      # Render injects PORT automatically; the backend reads it.
      - key: PORT
        value: 10000
