<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>P.E.T.E.R.</title>
<style>
  :root {
    --red: #e62429;
    --blue: #3d7bfd;
    --green: #2ecc71;
    --yellow: #f1c40f;
    --txt: #ffffff;
    --dim: #b8c4e0;
    --panel: rgba(20, 28, 52, .92);
    --line: rgba(255,255,255,.14);
    --glass: rgba(16, 24, 46, .82);
    --glass-hi: rgba(30, 40, 74, .9);
    --radius: 14px;
    --col: 340px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000000 !important;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--txt);
    overflow: hidden;
    user-select: none;
    width: 100%; height: 100%; height: 100vh;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10px 10px 12px;
    gap: 9px;
  }

  /* ── Unified command dock (URL + Share + Spotify in one glass panel) ── */
  .dock {
    width: 100%; max-width: var(--col); z-index: 5;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .dock .row {
    display: flex; align-items: center; gap: 6px;
    height: 32px;
  }
  .dock input[type="text"] {
    flex: 1; min-width: 0; height: 100%; padding: 0 11px; border-radius: 999px;
    border: 1px solid var(--line); outline: none; background: var(--panel);
    color: var(--txt); font-size: 11px; transition: border-color .2s, box-shadow .2s;
  }
  .dock input::placeholder { color: var(--dim); }
  .dock input:focus { border-color: var(--blue); box-shadow: 0 0 10px rgba(61,123,253,.4); }

  .row-action {
    flex: 1; height: 100%; cursor: pointer; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: #fff; font-size: 11px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    white-space: nowrap; overflow: hidden;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .row-action:hover { border-color: var(--blue); box-shadow: 0 0 10px rgba(61,123,253,.35); background: var(--glass-hi); }
  .row-action span { text-overflow: ellipsis; overflow: hidden; }
  .share-btn.sharing { border-color: var(--red); background: rgba(230,36,41,.22); box-shadow: 0 0 12px rgba(230,36,41,.45); }
  .share-btn .dot, .spotify-btn .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: none; }
  .share-btn.sharing .dot { background: var(--red); box-shadow: 0 0 6px var(--red); animation: blink 1.2s infinite; }
  .spotify-btn.authorized { border-color: var(--green); }
  .spotify-btn.authorized .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }

  .dock-mini {
    flex: none; width: 30px; height: 100%; cursor: pointer; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: #fff; font-size: 12px;
    font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: color .2s, border-color .2s, background .2s;
  }
  .dock-mini:hover { color: #fff; border-color: var(--red); background: rgba(230,36,41,.35); }
  .dock-mini:active { transform: scale(.92); }

  /* Spotify / Files pop panels */
  .pop-panel {
    position: absolute; bottom: calc(100% + 6px); left: 0; right: 0;
    background: rgba(10, 16, 32, .98); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.6);
    color: #fff; z-index: 6;
  }
  .pop-head { font-size: 10px; color: var(--dim); margin-bottom: 6px; line-height: 1.35; }
  .pop-panel select {
    width: 100%; padding: 6px 8px; border-radius: 8px; font-size: 10px;
    border: 1px solid var(--line); background: #0a1128; color: #fff; outline: none;
    max-height: 120px; overflow-y: auto;
  }
  .pop-note { font-size: 9px; color: var(--dim); margin-top: 6px; line-height: 1.4; }
  .pop-note a { color: var(--green); }
  .pop-set {
    margin-top: 6px; width: 100%; padding: 6px; border-radius: 8px;
    border: 1px solid rgba(46,204,113,.5); background: rgba(46,204,113,.15); color: #fff;
    font-size: 10px; cursor: pointer; transition: background .2s, border-color .2s;
  }
  .pop-set:hover { background: rgba(46,204,113,.28); border-color: var(--green); }
  .pop-clear {
    margin-top: 6px; width: 100%; padding: 6px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(230,36,41,.12); color: #fff;
    font-size: 10px; cursor: pointer; transition: background .2s, border-color .2s;
  }
  .pop-clear:hover { background: rgba(230,36,41,.3); border-color: var(--red); }

  .str-wrap { position: relative; }

  /* ── Status pill ── */
  .status {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; color: var(--dim); letter-spacing: .3px;
    background: rgba(10,16,34,.55); border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 999px; white-space: nowrap; max-width: 92%;
    overflow: hidden; z-index: 5; margin-top: 2px;
  }
  .status .txt { text-overflow: ellipsis; overflow: hidden; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: none; transition: background .3s, box-shadow .3s; }
  .dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.talking { background: var(--blue); box-shadow: 0 0 8px var(--blue); animation: blink 1.2s infinite; }
  .dot.speaking { background: var(--red); box-shadow: 0 0 10px var(--red); animation: blink .8s infinite; }
  @keyframes blink { 50% { opacity: .4; } }

  /* ── Peter's task progress bar — the track is always visible in the UI;
     the moving fill only lights up and animates while he's thinking / running a tool ── */
  .progress-wrap {
    position: relative; width: 100%; max-width: var(--col); height: 5px;
    border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden;
    z-index: 5; flex: none; margin-top: -3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .progress-wrap i {
    position: absolute; top: 0; left: 0; width: 0%; height: 100%;
    border-radius: 999px; background: var(--green);
    opacity: 0; transition: width .45s ease, opacity .2s;
    box-shadow: 0 0 8px rgba(46,204,113,.6);
  }
  .progress-wrap.show i { opacity: 1; }

  /* ── Files drop card ── */
  .files-slot { width: 100%; max-width: var(--col); position: relative; z-index: 5; }
  .drop-zone {
    width: 100%; min-height: 74px; padding: 10px 12px; border-radius: var(--radius);
    border: 1.5px dashed rgba(255,255,255,.28); background: rgba(20,28,52,.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; cursor: pointer; gap: 3px;
    transition: border-color .2s, background .2s, box-shadow .2s, transform .15s;
  }
  .drop-zone:hover { border-color: var(--blue); background: rgba(30,40,74,.6); box-shadow: 0 0 14px rgba(61,123,253,.25); }
  .drop-zone:active { transform: scale(.99); }
  .drop-zone.over { border-color: var(--green); background: rgba(46,204,113,.12); box-shadow: 0 0 16px rgba(46,204,113,.4); }
  .dz-ic { font-size: 20px; line-height: 1; }
  .dz-title { font-size: 11px; font-weight: 600; color: #fff; }
  .dz-sub { font-size: 9px; color: var(--dim); line-height: 1.3; }
  .dz-progress { display: none; margin-top: 2px; width: 100%; height: 4px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
  .dz-progress i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 999px; transition: width .2s; }

  .files-active {
    margin-top: 6px; width: 100%; min-height: 58px; border-radius: var(--radius);
    border: 1px solid var(--line); background: rgba(20,28,52,.6);
    padding: 8px 12px; display: none; align-items: center; gap: 10px;
  }
  .files-active.show { display: flex; }
  .file-chip { flex: none; width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(140deg, rgba(61,123,253,.32), rgba(230,36,41,.28)); border: 1px solid rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .file-meta { flex: 1; min-width: 0; }
  .file-name { font-size: 11px; font-weight: 600; color: #fff; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  .file-label { font-size: 8.5px; color: var(--dim); margin-top: 2px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  .file-pick { flex: none; cursor: pointer; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(20,28,52,.8); color: #fff; font-size: 9px; font-weight: 600; transition: border-color .2s, background .2s, box-shadow .2s; }
  .file-pick:hover { border-color: var(--blue); box-shadow: 0 0 10px rgba(61,123,253,.4); background: rgba(61,123,253,.22); }
  .file-pick:active { transform: scale(.95); }

  /* ── Hero orb ── */
  .orb-wrap { position: relative; width: 128px; height: 128px; z-index: 1; cursor: pointer; flex: none; }
  .halo { position: absolute; inset: 6px; border-radius: 50%; z-index: 0; background: radial-gradient(circle, rgba(61,123,253,.45) 0%, rgba(230,36,41,.28) 55%, transparent 72%); filter: blur(8px); animation: halo-breathe 3.2s ease-in-out infinite; }
  @keyframes halo-breathe { 0%,100% { transform: scale(.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
  .orb { position: relative; width: 102px; height: 102px; margin: 13px auto 0; border-radius: 50%; z-index: 1; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.28) 0%, transparent 42%), radial-gradient(circle at 50% 55%, #12204a 0%, #0a1128 70%); border: 2px solid rgba(255,255,255,.16); box-shadow: 0 8px 26px rgba(0,0,0,.55), 0 0 24px rgba(61,123,253,.35); display: flex; align-items: center; justify-content: center; transition: box-shadow .3s, border-color .3s, transform .15s; }
  .orb:hover { transform: scale(1.04); box-shadow: 0 8px 30px rgba(0,0,0,.6), 0 0 34px rgba(61,123,253,.55); }
  .orb:active { transform: scale(.96); }
  .orb .web { position: absolute; inset: 0; border-radius: 50%; opacity: .14; background-image: repeating-linear-gradient(45deg, #fff 0 1.5px, transparent 1.5px 11px), repeating-linear-gradient(-45deg, #fff 0 1.5px, transparent 1.5px 11px); }
  .orb .mask { position: absolute; width: 56px; height: 47px; border-radius: 50%; background: radial-gradient(circle at 40% 34%, #d43a3f 0%, var(--red) 58%, #a8181d 100%); border: 2px solid rgba(0,0,0,.5); box-shadow: inset 0 -3px 7px rgba(0,0,0,.4), 0 0 10px rgba(230,36,41,.4); }
  .orb .eye { position: absolute; width: 17px; height: 12px; background: #fff; border-radius: 50%; top: 43px; box-shadow: inset 0 -2px 3px rgba(0,0,0,.35); transition: transform .2s, height .2s; }
  .orb .eye.l { left: 44px; } .orb .eye.r { right: 44px; }
  .orb-wrap.interacting .orb .eye { transform: scaleY(.45); }
  .orb-wrap.speaking .orb { border-color: rgba(230,36,41,.7); box-shadow: 0 8px 30px rgba(0,0,0,.6), 0 0 36px rgba(230,36,41,.7); animation: speaking-glow 1.1s ease-in-out infinite; }
  .orb-wrap.speaking .halo { animation: halo-breathe 1.1s ease-in-out infinite; }
  @keyframes speaking-glow { 0%,100% { box-shadow: 0 8px 30px rgba(0,0,0,.6), 0 0 22px rgba(230,36,41,.55); transform: scale(1); } 50% { box-shadow: 0 8px 34px rgba(0,0,0,.65), 0 0 44px rgba(230,36,41,.95); transform: scale(1.06); } }
  .waves { position: absolute; inset: -6px; border-radius: 50%; z-index: 0; pointer-events: none; }
  .waves i { position: absolute; inset: 20px; border-radius: 50%; border: 2px solid rgba(230,36,41,0); }
  .orb-wrap.speaking .waves i:nth-child(1) { animation: ripple 1.2s ease-out infinite; }
  .orb-wrap.speaking .waves i:nth-child(2) { animation: ripple 1.2s ease-out .3s infinite; }
  .orb-wrap.speaking .waves i:nth-child(3) { animation: ripple 1.2s ease-out .6s infinite; }
  @keyframes ripple { 0% { transform: scale(.55); opacity: .9; border-color: rgba(230,36,41,.7); } 100% { transform: scale(1.6); opacity: 0; border-color: rgba(230,36,41,0); } }
  .orb-wrap.listening .orb { border-color: rgba(61,123,253,.65); animation: listen-pulse 1.2s ease-in-out infinite; }
  @keyframes listen-pulse { 0%,100% { box-shadow: 0 8px 30px rgba(0,0,0,.6), 0 0 24px rgba(61,123,253,.5); } 50% { box-shadow: 0 8px 34px rgba(0,0,0,.65), 0 0 42px rgba(61,123,253,.9); } }
  .tap-hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: -4px; font-size: 10px; color: var(--dim); letter-spacing: .5px; text-shadow: 0 1px 4px rgba(0,0,0,.8); white-space: nowrap; }

  .loader { display: inline-block; width: 10px; height: 10px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: rotate .7s linear infinite; }
  @keyframes rotate { to { transform: rotate(360deg); } }

  /* ── Task bar: what Peter is doing right now, front and center ── */
  .taskbar { width: 100%; max-width: var(--col); flex: none; z-index: 2; box-sizing: border-box;
    background: rgba(20,28,52,.55); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 9px; min-height: 80px; transition: border-color .25s, box-shadow .25s;
  }
  .taskbar.active { border-color: rgba(61,123,253,.5); box-shadow: 0 0 18px rgba(61,123,253,.18); }
  .taskbar-label { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: .2px; text-align: center; transition: color .2s; }
  .taskbar.active .taskbar-label { color: #fff; }
  .taskbar .progress-wrap { margin-top: 0; }

  /* ── Chat transcript below the orb ── */
  .chat { width: 100%; max-width: var(--col); display: flex; flex-direction: column; background: rgba(20,28,52,.55); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; z-index: 2; flex: none; }
  .chat-log { height: 190px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 9px; scroll-behavior: smooth; }
  .chat-log::-webkit-scrollbar { width: 5px; }
  .chat-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 999px; }
  .msg { display: flex; flex-direction: column; max-width: 94%; }
  .msg.peter { align-self: flex-start; align-items: flex-start; }
  .msg .who { font-size: 9px; color: var(--dim); letter-spacing: .4px; margin-bottom: 2px; }
  .msg .bubble { padding: 8px 10px; border-radius: 12px; font-size: 12px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
  .msg.peter .bubble { background: rgba(230,36,41,.16); border: 1px solid rgba(230,36,41,.3); }
  .msg.peter a { color: var(--blue); text-decoration: underline; }

  /* ── CAD design file card (dropped into the chat when Peter designs a part) ── */
  .bubble.file-card { display: flex; flex-direction: column; gap: 6px; padding: 9px 10px; }
  .file-card-head { font-size: 12.5px; font-weight: 700; color: #fff; }
  .file-card-sub { font-size: 10.5px; color: var(--dim); line-height: 1.3; }
  .file-card-preview { width: 100%; max-height: 150px; object-fit: contain; border-radius: 8px;
    background: #0a1128; border: 1px solid var(--line); display: block; }
  .file-card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .fc-btn { cursor: pointer; padding: 5px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
    border: 1px solid rgba(46,204,113,.5); background: rgba(46,204,113,.15); color: #fff;
    transition: background .2s, border-color .2s; }
  .fc-btn:hover { background: rgba(46,204,113,.3); }
  .fc-btn.secondary { border-color: var(--line); background: rgba(255,255,255,.06); }
  .fc-btn.secondary:hover { background: rgba(255,255,255,.14); }

  /* ── Result card (dropped into the chat when Peter writes a result via
     show_in_chat, instead of / in addition to saying it out loud) ── */
  .bubble.result-card { border-left: 2px solid var(--green); }
  .result-card-head { font-size: 12.5px; font-weight: 700; color: #fff; margin-bottom: 4px; }

  /* ── Search-result links card (dropped into the chat whenever a search
     tool finds real links — Peter never reads full URLs out loud) ── */
  .link-list { display: flex; flex-direction: column; gap: 5px; }
  .link-item { color: var(--blue); text-decoration: underline; font-size: 11px; line-height: 1.4;
    display: block; word-break: break-word; }
  .link-item:hover { color: #fff; }

  /* ── Agenda (calendar) panel ── */
  .agenda-btn.has-events { border-color: var(--blue); }
  .agenda-overlay {
    position: absolute; inset: 0; z-index: 9;
    background: rgba(0,0,0,.92);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 34px 10px 10px;
  }
  .agenda-overlay[hidden] { display: none; }
  .agenda-panel {
    width: 100%; max-width: var(--col);
    max-height: calc(100% - 10px); overflow-y: auto;
    background: var(--glass-hi); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.6);
  }
  .agenda-panel::-webkit-scrollbar { width: 5px; }
  .agenda-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 999px; }
  .ag-head { display: flex; align-items: center; gap: 6px; }
  .ag-title { flex: 1; text-align: center; font-size: 13px; font-weight: 700; }
  .ag-nav, .ag-close {
    flex: none; cursor: pointer; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: #fff; display: flex; align-items: center; justify-content: center;
    transition: border-color .2s, background .2s;
  }
  .ag-nav { width: 26px; height: 26px; font-size: 15px; }
  .ag-nav:hover { border-color: var(--blue); background: rgba(61,123,253,.25); }
  .ag-close { width: 22px; height: 22px; font-size: 10px; background: rgba(230,36,41,.15); }
  .ag-close:hover { border-color: var(--red); background: rgba(230,36,41,.4); }
  .ag-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 9px; color: var(--dim); text-align: center; padding: 2px 0; }
  .ag-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .ag-cell {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid transparent; background: rgba(255,255,255,.04);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10.5px; color: #fff; cursor: pointer; gap: 2px; transition: border-color .15s, background .15s;
  }
  .ag-cell.empty { visibility: hidden; cursor: default; }
  .ag-cell:hover { border-color: var(--blue); background: rgba(61,123,253,.15); }
  .ag-cell.today { border-color: var(--green); }
  .ag-cell.selected { background: rgba(61,123,253,.35); border-color: var(--blue); }
  .ag-dots { display: flex; gap: 2px; }
  .ag-dot { width: 5px; height: 5px; border-radius: 50%; }
  .ag-dot.red { background: var(--red); } .ag-dot.green { background: var(--green); }
  .ag-dot.blue { background: var(--blue); } .ag-dot.yellow { background: var(--yellow); }
  .ag-day-panel { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .ag-day-head { font-size: 11px; font-weight: 600; color: #fff; }
  .ag-day-events { display: flex; flex-direction: column; gap: 5px; }
  .ag-day-empty { font-size: 10px; color: var(--dim); }
  .ag-event-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,.05); font-size: 10.5px; }
  .ag-event-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .ag-event-dot.red { background: var(--red); } .ag-event-dot.green { background: var(--green); }
  .ag-event-dot.blue { background: var(--blue); } .ag-event-dot.yellow { background: var(--yellow); }
  .ag-event-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ag-event-time { color: var(--dim); font-size: 9.5px; }
  .ag-event-del { cursor: pointer; color: var(--dim); font-size: 11px; padding: 2px 5px; }
  .ag-event-del:hover { color: var(--red); }
  .ag-add-form { display: flex; flex-direction: column; gap: 6px; }
  .ag-add-form input[type="text"], .ag-add-form input[type="time"] {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: #0a1128;
    color: #fff; font-size: 10.5px; outline: none;
  }
  .ag-add-form input[type="text"] { width: 100%; }
  .ag-add-row { display: flex; gap: 8px; align-items: center; }
  .ag-add-row input[type="time"] { flex: 1; min-width: 0; }
  .ag-colors { display: flex; gap: 6px; }
  .ag-swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .ag-swatch.red { background: var(--red); } .ag-swatch.green { background: var(--green); }
  .ag-swatch.blue { background: var(--blue); } .ag-swatch.yellow { background: var(--yellow); }
  .ag-swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .ag-add-btn {
    padding: 7px; border-radius: 8px; border: 1px solid rgba(46,204,113,.5);
    background: rgba(46,204,113,.15); color: #fff; font-size: 10.5px; cursor: pointer;
    transition: background .2s;
  }
  .ag-add-btn:hover { background: rgba(46,204,113,.3); }

  /* ── Window controls ── */

<!-- LiveKit client (UMD — exposes window.LivekitClient) -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>

<script>
const $ = (id) => document.getElementById(id);
const statusDot = $('statusDot'), statusText = $('statusText');
const orbWrap = $('orbWrap');

let room = null, micTrack = null, audioEl = null;
let liveKitToken = null, liveKitUrl = null, active = false, connecting = false;

// Devtools are disabled in production, so route every uncaught error/
// rejection to ui_debug.log (via clientLog, defined below) — otherwise a
// silent JS error here is invisible to both the user and whoever's debugging.
window.addEventListener('error', (e) => {
  try { clientLog('window error: ' + (e && e.message) + ' @ ' + (e && e.filename) + ':' + (e && e.lineno)); } catch (_) {}
});
window.addEventListener('unhandledrejection', (e) => {
  try { clientLog('unhandled promise rejection: ' + (e && e.reason)); } catch (_) {}
});

function setStatus(kind, text) {
  statusDot.className = 'dot' + (kind ? ' ' + kind : '');
  statusText.textContent = text;
}

function setOrbState(state) {
  orbWrap.classList.remove('speaking', 'listening', 'interacting');
  if (state === 'speaking') orbWrap.classList.add('speaking');
  else if (state === 'listening') orbWrap.classList.add('listening');
  else if (state === 'interacting') orbWrap.classList.add('interacting');
}

async function loadConnectionInfo() {
  try {
    const info = await window.pywebview.api.get_connection_info();
    liveKitUrl = info.url;
    liveKitToken = info.token;
    setStatus('online', 'Clap or tap to talk');
    return true;
  } catch (e) {
    console.error(e);
    setStatus('', 'Token error');
    return false;
  }
}

async function toggleCall() {
  if (connecting) return; // ignore double-taps while a connect attempt is in flight
  if (active) { await endCall(); return; }
  if (!liveKitToken && !(await loadConnectionInfo())) return;
  connecting = true;
  stopClapListener(); // free the mic + stop listening for wake-claps while we're on a call
  setOrbState('interacting');
  $('tapHint').textContent = 'Connecting…';
  try {
    room = new LivekitClient.Room();
    room.on(LivekitClient.RoomEvent.TrackSubscribed, onTrackSubscribed);
    room.on(LivekitClient.RoomEvent.DataReceived, handleDataReceived);
    room.on(LivekitClient.RoomEvent.MediaDevicesError, (e) => console.error('media error', e));
    room.on(LivekitClient.RoomEvent.Disconnected, onRoomDisconnected);
    room.on(LivekitClient.RoomEvent.AudioPlaybackStatusChanged, onAudioPlaybackStatusChanged);
    await room.connect(liveKitUrl, liveKitToken, { autoSubscribe: true });
    micTrack = await LivekitClient.createLocalAudioTrack();
    await room.localParticipant.publishTrack(micTrack);
    setStatus('talking', 'Listening…');
    await waitForAgent(60000);
    setStatus('talking', 'Peter is listening');
    active = true;
    setOrbState('listening');
    $('tapHint').textContent = 'Tap to end';
  } catch (e) {
    console.error(e);
    // Devtools are disabled in the packaged app, so console.error alone is
    // invisible — without this, a failed connect attempt leaves no trace
    // anywhere, which is exactly what made a run of silent failures here
    // look like "Peter isn't hearing me" with zero diagnostic evidence.
    clientLog('toggleCall failed: ' + (e && (e.stack || e.message) || e));
    setStatus('', 'Could not reach Peter');
    $('tapHint').textContent = 'Clap or tap to talk';
    setOrbState(null);
    showTaskProgress(false);
    await cleanupRoom();
  } finally {
    connecting = false;
    if (!active) startClapListener(); // not on a call — (re)start listening for a clap
  }
}

// If the room drops unexpectedly (network blip, agent crash, server kick),
// don't leave the UI stuck showing "listening" for a call that's actually dead.
function onRoomDisconnected() {
  if (!active) return;
  active = false;
  setOrbState(null);
  showTaskProgress(false);
  setTaskbar(false, 'Ready to help!');
  $('tapHint').textContent = 'Clap or tap to talk';
  setStatus('', 'Disconnected — tap to reconnect');
  room = null; micTrack = null;
  if (audioEl) { audioEl.remove(); audioEl = null; }
  startClapListener(); // call ended — resume listening for the next wake-clap
}

function onTrackSubscribed(track, publication, participant) {
  if (track.kind !== 'audio') return;
  try {
    // track.attach() is LiveKit's own managed playback path — it creates and
    // plays an <audio> element AND wires up the AudioPlaybackFailed/Started
    // tracking that drives canPlaybackAudio below. A second, hand-rolled
    // AudioContext->destination graph used to run alongside this, adding no
    // benefit and (since it wasn't guarded like audioEl is) re-connecting a
    // fresh source node on every TrackSubscribed firing.
    if (!audioEl) { audioEl = track.attach(); audioEl.autoplay = true; document.body.appendChild(audioEl); }
    setOrbState('speaking');
    track.on(LivekitClient.TrackEvent.Ended, () => { if (active) setOrbState('listening'); });
  } catch (e) { console.error('failed to play agent audio', e); }
}

// Chromium's autoplay policy can block Peter's voice from actually playing
// even though everything else (status text, orb animation) keeps working —
// that's exactly the "it says speaking but no sound" symptom. LiveKit
// detects this via canPlaybackAudio; when it's blocked, the fix is a real
// user gesture calling room.startAudio(), so the next tap anywhere retries it.
function onAudioPlaybackStatusChanged() {
  if (!room || room.canPlaybackAudio) return;
  console.warn('Audio playback blocked by the browser — waiting for a tap to unlock it.');
  $('tapHint').textContent = 'Tap anywhere for sound';
}
document.addEventListener('click', () => {
  // Extra safety net for the clap listener's AudioContext, in case the
  // autoplay-gesture policy wasn't fully disabled for some reason — any
  // click anywhere unlocks it immediately.
  if (clapCtx && clapCtx.state !== 'running') clapCtx.resume().catch(() => {});
  if (!room || room.canPlaybackAudio) return;
  room.startAudio().then(() => {
    if (active) $('tapHint').textContent = 'Tap to end';
  }).catch((e) => console.error('startAudio retry failed', e));
});

// ── Clap-to-connect ── listens continuously (from app boot) on a mic stream
// of its own — separate from the LiveKit call mic — for a double-clap
// pattern, and connects to Peter the same way tapping the orb does. Requiring
// two sharp claps in quick succession (rather than one) avoids false wakes
// from a single loud bang, dropped object, or cough. Paused whenever a call
// is connecting/active (frees the mic, and a live call ignores claps), and
// resumed automatically whenever the call ends or fails.
//
// Sensitivity is adaptive rather than one fixed magic number: a clap must
// beat a rolling estimate of the room's own ambient noise level by
// CLAP_RATIO, so it self-tunes to whatever mic/gain/distance the user has
// instead of relying on a guessed constant that's wrong for their setup.
const CLAP_MIN_PEAK = 0.05;        // absolute floor — never trigger on near-silence, no matter the ratio
const CLAP_RATIO = 3;              // a clap's peak must be this many x louder than the recent ambient floor
const NOISE_FLOOR_ALPHA = 0.03;    // how fast the ambient-floor estimate adapts (per ~25ms tick)
const CLAP_COOLDOWN_MS = 200;      // ignore further spikes this long after one clap (its own decay/echo)
const CLAP_PAIR_WINDOW_MS = 1200;  // two claps must land within this long of each other
const CLAP_POLL_MS = 25;           // analysis tick rate — shorter than the analyser window below, so no gaps
const CLAP_WARMUP_MS = 500;        // ignore samples right after the stream opens — a fresh getUserMedia
                                    // stream/AudioContext commonly emits a loud startup pop/click as the
                                    // hardware settles, which a peak detector reads as an instant "clap".
                                    // Without this, that single pop can look like BOTH claps of a pair
                                    // (they land in the same ~25ms tick window), auto-triggering a connect
                                    // attempt the instant the listener starts — and if that attempt then
                                    // fails, stopClapListener()/startClapListener() cycles again, producing
                                    // the pop again, in an unintended reconnect loop that looks like Peter
                                    // never hears anything.
let clapStream = null, clapCtx = null, clapAnalyser = null, clapInterval = null;
let clapTimes = [], lastClapAt = 0, noiseFloor = 0.01, clapListenerStartedAt = 0;
let clapRetryTimer = null, clapRetryDelay = 1500, lastDiagLogAt = 0;

function clientLog(msg) {
  console.log(msg);
  try { window.pywebview && window.pywebview.api && window.pywebview.api.client_log(msg); } catch (e) {}
}

async function startClapListener() {
  if (clapStream || active || connecting) return; // already listening, or a call is using the mic
  clearTimeout(clapRetryTimer);
  try {
    clapStream = await navigator.mediaDevices.getUserMedia({
      // AGC boosts quiet/far claps instead of leaving them under the floor;
      // echo/noise suppression stay off since they're tuned for voice and
      // actively fight percussive transients like a clap.
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
    });
    clapCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = clapCtx.createMediaStreamSource(clapStream);
    clapAnalyser = clapCtx.createAnalyser();
    clapAnalyser.fftSize = 2048; // ~43ms window at 48kHz — wider than the poll interval so no sample gaps
    source.connect(clapAnalyser);
    const data = new Float32Array(clapAnalyser.fftSize);
    clapRetryDelay = 1500; // reset backoff after a clean start
    clapListenerStartedAt = Date.now();
    clientLog('clap listener: mic acquired, listening for claps');
    clapInterval = setInterval(() => {
      if (!clapAnalyser || !clapCtx) return;
      if (clapCtx.state !== 'running') {
        // Chromium can leave a freshly-created AudioContext suspended until
        // a user gesture; keep nudging it every tick so detection starts
        // working the instant it's allowed to run, with no click required.
        clapCtx.resume().catch(() => {});
        return;
      }
      clapAnalyser.getFloatTimeDomainData(data);
      let peak = 0;
      for (let i = 0; i < data.length; i++) { const v = Math.abs(data[i]); if (v > peak) peak = v; }
      const now = Date.now();
      if (now - clapListenerStartedAt < CLAP_WARMUP_MS) return; // ride out the stream's startup pop
      const coolingDown = now - lastClapAt < CLAP_COOLDOWN_MS;
      const dynamicThreshold = Math.max(CLAP_MIN_PEAK, noiseFloor * CLAP_RATIO);
      // Periodic proof-of-life: confirms real mic signal is flowing (not
      // silently stuck at 0 from a suspended AudioContext) and shows exactly
      // how close ambient/clap levels are to the trigger threshold.
      if (now - lastDiagLogAt > 3000) {
        lastDiagLogAt = now;
        clientLog('mic level — peak=' + peak.toFixed(3) + ' floor=' + noiseFloor.toFixed(3) + ' threshold=' + dynamicThreshold.toFixed(3) + ' ctxState=' + clapCtx.state);
      }
      if (!coolingDown && peak > dynamicThreshold) {
        lastClapAt = now;
        onClapDetected(now);
      } else if (!coolingDown) {
        // Let the floor drift toward ambient level; cap the sample so a
        // clap itself (already below-threshold ones included) never drags
        // the floor up and desensitizes future detection.
        noiseFloor = noiseFloor * (1 - NOISE_FLOOR_ALPHA) + Math.min(peak, dynamicThreshold) * NOISE_FLOOR_ALPHA;
      }
    }, CLAP_POLL_MS);
  } catch (e) {
    clientLog('clap listener error: ' + (e && e.message ? e.message : e));
    stopClapListener();
    // Self-heal: mic-permission grant can race the app's own boot sequence —
    // keep retrying with backoff instead of giving up on the first failure.
    clapRetryTimer = setTimeout(() => startClapListener(), clapRetryDelay);
    clapRetryDelay = Math.min(clapRetryDelay * 2, 15000);
  }
}

function stopClapListener() {
  clearTimeout(clapRetryTimer);
  if (clapInterval) clearInterval(clapInterval);
  clapInterval = null;
  clapAnalyser = null;
  if (clapStream) { clapStream.getTracks().forEach((t) => t.stop()); clapStream = null; }
  if (clapCtx) { clapCtx.close().catch(() => {}); clapCtx = null; }
  clapTimes = [];
}

function onClapDetected(now) {
  clapTimes = clapTimes.filter((t) => now - t < CLAP_PAIR_WINDOW_MS);
  clapTimes.push(now);
  clientLog('clap detected (' + clapTimes.length + (clapTimes.length === 1 ? '/2)' : '/2) — connecting'));
  if (clapTimes.length === 1) {
    // Brief visual feedback so a real clap looks "heard" even before the
    // second one lands (reuses the existing eye-squint animation).
    orbWrap.classList.add('interacting');
    setTimeout(() => { if (!active && !connecting) orbWrap.classList.remove('interacting'); }, 220);
  } else if (clapTimes.length >= 2) {
    clapTimes = [];
    if (!active && !connecting) toggleCall();
  }
}

function waitForAgent(timeoutMs) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    const timer = setInterval(() => {
      const hasAgent = room && room.remoteParticipants.size > 0;
      if (hasAgent) {
        clearInterval(timer);
        room.remoteParticipants.forEach((p) => p.trackPublications.forEach((pub) => { if (pub.kind === 'audio' && pub.track && !pub.track.isSubscribed) pub.setSubscribed(true); }));
        resolve();
      } else if (Date.now() - t0 > timeoutMs) { clearInterval(timer); reject(new Error('timeout waiting for Peter')); }
    }, 400);
  });
}

async function cleanupRoom() {
  try {
    if (micTrack) { micTrack.stop(); micTrack = null; }
    if (audioEl) { audioEl.remove(); audioEl = null; }
    if (room) { await room.disconnect(); room = null; }
  } catch (e) { console.error(e); }
}

async function endCall() {
  // Flip `active` off first so the Disconnected event fired by room.disconnect()
  // below sees onRoomDisconnected's guard and skips its redundant reset.
  active = false;
  await cleanupRoom();
  screenTrack = null;
  setSharing(false);
  setOrbState(null);
  showTaskProgress(false);
  setTaskbar(false, 'Ready to help!');
  $('tapHint').textContent = 'Clap or tap to talk';
  setStatus('online', 'Clap or tap to talk');
  startClapListener(); // call ended — resume listening for the next wake-clap
}

const urlInput = $('urlInput'), urlClear = $('urlClear');
let urlSaveTimer = null;
function saveUrl() {
  clearTimeout(urlSaveTimer);
  urlSaveTimer = setTimeout(async () => {
    try { await window.pywebview.api.set_pending_url(urlInput.value.trim()); } catch (e) { console.error('failed to save URL', e); }
  }, 300);
}
async function loadUrl() {
  try { const r = await window.pywebview.api.get_pending_url(); if (r && r.url) urlInput.value = r.url; } catch (e) { console.error('failed to load URL', e); }
}
urlInput.addEventListener('input', saveUrl);
urlClear.addEventListener('click', async () => {
  urlInput.value = '';
  try { await window.pywebview.api.set_pending_url(''); } catch (e) { console.error(e); }
});
orbWrap.addEventListener('click', toggleCall);

const shareBtn = $('shareBtn'), shareLabel = $('shareLabel');
let screenTrack = null;
function setSharing(on) {
  shareBtn.classList.toggle('sharing', on);
  shareLabel.textContent = on ? 'Sharing screen' : 'Share screen';
}
async function stopScreenShare() {
  if (screenTrack) { try { screenTrack.stop(); } catch (e) {} screenTrack = null; }
  if (room && active) { try { await room.localParticipant.unpublishTrack('screen'); } catch (e) { console.error('unpublish screen error', e); } }
  setSharing(false);
}
async function startScreenShare() {
  if (!room || !active) { setStatus('', 'Join a call first (tap the orb)'); return; }
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { width: { ideal: 1280, max: 1280 }, height: { ideal: 720, max: 720 }, frameRate: { ideal: 4, max: 5 } } });
    screenTrack = stream.getVideoTracks()[0];
    if (!screenTrack) throw new Error('No screen track selected');
    screenTrack.onended = () => { screenTrack = null; setSharing(false); };
    await room.localParticipant.publishTrack(screenTrack, { source: 'screen', name: 'screen' });
    setSharing(true);
  } catch (e) { console.error('screen share error', e); setStatus('', 'Screen share cancelled'); }
}
shareBtn.addEventListener('click', async () => { if (screenTrack) { await stopScreenShare(); } else { await startScreenShare(); } });

const spotifyBtn = $('spotifyBtn'), spotifyLabel = $('spotifyLabel');
const spotifyPanel = $('spotifyPanel'), spotifyHead = $('spotifyHead');
const spotifyPlaylist = $('spotifyPlaylist'), spotifyNote = $('spotifyNote');

async function loadSpotify() {
  try {
    const s = await window.pywebview.api.spotify_status();
    if (s && s.authorized) {
      spotifyBtn.classList.add('authorized');
      if (s.default && s.default.name) spotifyLabel.textContent = s.default.name; else spotifyLabel.textContent = 'Linked ✓';
    } else {
      spotifyBtn.classList.remove('authorized');
      spotifyLabel.textContent = 'Link Spotify';
      if (s && s.client_id_set) spotifyHead.textContent = 'Linked ✓ — tap 🎧 to pick a playlist'; else spotifyHead.textContent = 'Add SPOTIFY_CLIENT_ID to .env first.';
    }
  } catch (e) { console.error('loadSpotify', e); }
}

spotifyBtn.addEventListener('click', async (e) => {
  e.stopPropagation();
  if (spotifyPanel.hidden) { spotifyPanel.hidden = false; await openSpotifyPanel(); } else { spotifyPanel.hidden = true; }
});

async function openSpotifyPanel() {
  spotifyPlaylist.hidden = true;
  spotifyNote.textContent = '';
  let s;
  try { s = await window.pywebview.api.spotify_status(); } catch (err) { console.error(err); }
  if (!s || !s.authorized) {
    if (!s || !s.client_id_set) {
      spotifyHead.textContent = 'Add SPOTIFY_CLIENT_ID & SPOTIFY_CLIENT_SECRET to .env, then restart the app to link Spotify.';
    } else {
      spotifyHead.textContent = 'Tap "Authorize" below to connect Spotify in your browser.';
      spotifyNote.innerHTML = '<a href="#" id="authNow">Authorize Spotify now</a>';
      const a = $('authNow');
      if (a) a.addEventListener('click', async (ev) => { ev.preventDefault(); spotifyHead.textContent = 'Opening browser… authorize and come back here.'; try { await window.pywebview.api.spotify_authorize(); setTimeout(loadSpotify, 4000); } catch (err) { console.error(err); } });
    }
    return;
  }
  const pls = await window.pywebview.api.spotify_get_playlists();
  if (!pls || !pls.ok || !pls.playlists.length) { spotifyHead.textContent = 'No playlists found on your Spotify.'; return; }
  spotifyHead.textContent = 'Choose your default playlist:';
  spotifyPlaylist.innerHTML = '';
  let selectedDefault = '';
  if (s && s.default) selectedDefault = s.default.id || s.default.uri || '';
  pls.playlists.forEach((p) => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    if (selectedDefault && (p.id === selectedDefault || p.uri === selectedDefault || p.id === selectedDefault.split(':').pop())) opt.selected = true;
    spotifyPlaylist.appendChild(opt);
  });
  spotifyPlaylist.hidden = false;
  spotifyNote.innerHTML = '';
  const noteTxt = document.createElement('span');
  noteTxt.id = 'spotifyNoteTxt';
  const firstSel = spotifyPlaylist.selectedOptions[0];
  noteTxt.textContent = firstSel ? 'Tap "Set default →" to save: ' + firstSel.textContent : 'Choose a playlist, then tap "Set default →".';
  spotifyNote.appendChild(noteTxt);
  const saveBtn = document.createElement('button');
  saveBtn.className = 'pop-set';
  saveBtn.textContent = 'Set default →';
  saveBtn.addEventListener('click', async () => {
    const sel = spotifyPlaylist.selectedOptions[0];
    if (!sel) return;
    await window.pywebview.api.spotify_set_default_playlist(sel.value, sel.textContent);
    spotifyLabel.textContent = sel.textContent;
    spotifyNote.textContent = 'Saved! Say "play my music" to Peter.';
  });
  spotifyNote.appendChild(saveBtn);
  spotifyPlaylist.addEventListener('change', () => {
    const sel = spotifyPlaylist.selectedOptions[0];
    const t = document.getElementById('spotifyNoteTxt');
    if (sel && t) t.textContent = 'Tap "Set default →" to save: ' + sel.textContent;
  });
}

// ── Agenda (calendar) panel ──────────────────────────────────
const agendaBtn = $('agendaBtn'), agendaOverlay = $('agendaOverlay');
const agPrev = $('agPrev'), agNext = $('agNext'), agTitle = $('agTitle'), agGrid = $('agGrid'), agClose = $('agClose');
const agDayHead = $('agDayHead'), agDayEvents = $('agDayEvents');
const agName = $('agName'), agTime = $('agTime'), agColors = $('agColors'), agAddBtn = $('agAddBtn');
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let agViewYear = 0, agViewMonth = 0, agSelectedDate = null, agSelectedColor = 'blue', agMonthEvents = [];

function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

function openAgenda() {
  const now = new Date();
  agViewYear = now.getFullYear();
  agViewMonth = now.getMonth() + 1;
  agSelectedDate = todayStr();
  agendaOverlay.hidden = false;
  renderAgendaMonth();
}
function closeAgenda() { agendaOverlay.hidden = true; }
agendaBtn.addEventListener('click', (e) => { e.stopPropagation(); agendaOverlay.hidden ? openAgenda() : closeAgenda(); });
agClose.addEventListener('click', (e) => { e.stopPropagation(); closeAgenda(); });
agPrev.addEventListener('click', (e) => { e.stopPropagation(); agViewMonth--; if (agViewMonth < 1) { agViewMonth = 12; agViewYear--; } renderAgendaMonth(); });
agNext.addEventListener('click', (e) => { e.stopPropagation(); agViewMonth++; if (agViewMonth > 12) { agViewMonth = 1; agViewYear++; } renderAgendaMonth(); });

async function renderAgendaMonth() {
  agTitle.textContent = MONTH_NAMES[agViewMonth - 1] + ' ' + agViewYear;
  let res;
  try { res = await window.pywebview.api.calendar_get_month(agViewYear, agViewMonth); }
  catch (e) { console.error('calendar_get_month', e); res = null; }
  agMonthEvents = (res && res.events) || [];

  agGrid.innerHTML = '';
  const firstDow = new Date(agViewYear, agViewMonth - 1, 1).getDay();
  const daysInMonth = new Date(agViewYear, agViewMonth, 0).getDate();
  const tStr = todayStr();
  for (let i = 0; i < firstDow; i++) {
    const c = document.createElement('div'); c.className = 'ag-cell empty';
    agGrid.appendChild(c);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = agViewYear + '-' + pad2(agViewMonth) + '-' + pad2(d);
    const cell = document.createElement('div');
    cell.className = 'ag-cell';
    if (dateStr === tStr) cell.classList.add('today');
    if (dateStr === agSelectedDate) cell.classList.add('selected');
    const num = document.createElement('div'); num.textContent = d;
    cell.appendChild(num);
    const dayEvents = agMonthEvents.filter((ev) => ev.date === dateStr);
    if (dayEvents.length) {
      const dots = document.createElement('div'); dots.className = 'ag-dots';
      const seen = new Set();
      dayEvents.forEach((ev) => {
        if (seen.has(ev.color) || seen.size >= 4) return;
        seen.add(ev.color);
        const dot = document.createElement('span'); dot.className = 'ag-dot ' + ev.color;
        dots.appendChild(dot);
      });
      cell.appendChild(dots);
    }
    cell.addEventListener('click', () => { agSelectedDate = dateStr; renderAgendaMonth(); });
    agGrid.appendChild(cell);
  }
  renderDayPanel();
}

function renderDayPanel() {
  agDayHead.textContent = agSelectedDate || 'Select a date';
  agDayEvents.innerHTML = '';
  const dayEvents = agSelectedDate ? agMonthEvents.filter((ev) => ev.date === agSelectedDate) : [];
  if (!dayEvents.length) {
    const p = document.createElement('div'); p.className = 'ag-day-empty'; p.textContent = 'Nothing scheduled.';
    agDayEvents.appendChild(p);
  }
  dayEvents.forEach((ev) => {
    const item = document.createElement('div'); item.className = 'ag-event-item';
    const dot = document.createElement('span'); dot.className = 'ag-event-dot ' + ev.color; item.appendChild(dot);
    const name = document.createElement('span'); name.className = 'ag-event-name'; name.textContent = ev.name; item.appendChild(name);
    if (ev.time) { const t = document.createElement('span'); t.className = 'ag-event-time'; t.textContent = ev.time; item.appendChild(t); }
    const del = document.createElement('span'); del.className = 'ag-event-del'; del.textContent = '✕'; del.title = 'Remove';
    del.addEventListener('click', async () => {
      try { await window.pywebview.api.calendar_remove_event(ev.id); } catch (e) { console.error('calendar_remove_event', e); }
      renderAgendaMonth();
    });
    item.appendChild(del);
    agDayEvents.appendChild(item);
  });
}

agColors.querySelectorAll('.ag-swatch').forEach((sw) => {
  sw.addEventListener('click', () => {
    agSelectedColor = sw.dataset.color;
    agColors.querySelectorAll('.ag-swatch').forEach((s) => s.classList.remove('selected'));
    sw.classList.add('selected');
  });
});
const agDefaultSwatch = agColors.querySelector('.ag-swatch.' + agSelectedColor);
if (agDefaultSwatch) agDefaultSwatch.classList.add('selected');

agAddBtn.addEventListener('click', async () => {
  if (!agSelectedDate) return;
  const name = agName.value.trim();
  if (!name) { agName.focus(); return; }
  try {
    const r = await window.pywebview.api.calendar_add_event(agSelectedDate, agTime.value || '', name, agSelectedColor);
    if (r && r.ok) { agName.value = ''; agTime.value = ''; renderAgendaMonth(); }
    else console.error('calendar_add_event failed', r);
  } catch (e) { console.error('calendar_add_event', e); }
});

const dropZone = $('dropZone'), dzProgress = $('dzProgress'), dzBar = dzProgress.querySelector('i');
const filesActive = $('filesActive'), activeFileName = $('activeFileName'), activeFileLabel = $('activeFileLabel');
const filePick = $('filePick'), filesPanel = $('filesPanel'), filesHead = $('filesHead');
const filesList = $('filesList'), filesSet = $('filesSet'), filesNote = $('filesNote');

function setDzBusy(busy) {
  dzProgress.style.display = busy ? 'block' : 'none';
  if (busy) { dzBar.style.width = '0%'; requestAnimationFrame(() => { dzBar.style.transition = 'none'; dzBar.style.width = '70%'; setTimeout(() => { dzBar.style.transition = ''; dzBar.style.width = '100%'; }, 50); }); }
}
function showActiveFile(fs) {
  const name = (fs && fs.active) || '';
  if (name) { activeFileName.textContent = name; activeFileLabel.textContent = 'Active file — Peter can read this'; filesActive.classList.add('show'); }
  else { activeFileName.textContent = 'No file'; activeFileLabel.textContent = 'No active file selected'; filesActive.classList.remove('show'); }
}
async function refreshFiles() {
  let fs;
  try { fs = await window.pywebview.api.files_status(); } catch (e) { console.error('files_status', e); return; }
  showActiveFile(fs);
  const list = (fs && fs.files) || [];
  filesList.innerHTML = '';
  list.forEach((f) => { const opt = document.createElement('option'); opt.value = f; opt.textContent = f; if (fs.active === f) opt.selected = true; filesList.appendChild(opt); });
}
async function saveDroppedFile(file) {
  setDzBusy(true);
  try {
    const data = await new Promise((resolve, reject) => {
      const rd = new FileReader();
      rd.onload = () => resolve((rd.result || '').split(',')[1] || '');
      rd.onerror = reject;
      rd.readAsDataURL(file);
    });
    const r = await window.pywebview.api.files_save(file.name || 'unnamed.txt', data);
    if (r && r.ok) { await refreshFiles(); filesNote.textContent = 'Saved & set active: ' + r.name + '  (say "talk about my file" to Peter)'; }
    else { filesNote.textContent = 'Could not save that file' + ((r && r.error) ? ': ' + r.error : '.') ; }
  } catch (e) { console.error('saveDroppedFile', e); filesNote.textContent = 'Could not read that file.'; }
  finally { setDzBusy(false); dropZone.classList.remove('over'); }
}
dropZone.addEventListener('click', async () => {
  try {
    const r = await window.pywebview.api.files_choose();
    if (r && r.ok) { await refreshFiles(); filesNote.textContent = 'Saved & set active: ' + r.name; }
    else if (r && r.cancelled) { }
    else { filesNote.textContent = 'Could not open that file.'; }
  } catch (e) { console.error('files_choose', e); }
});
['dragenter', 'dragover'].forEach((evt) => dropZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('over'); }));
['dragleave', 'drop'].forEach((evt) => dropZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); e.type !== 'drop' && dropZone.classList.remove('over'); }));
dropZone.addEventListener('drop', (e) => { const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (file) saveDroppedFile(file); });

filePick.addEventListener('click', async (e) => {
  e.stopPropagation();
  if (filesPanel.hidden) {
    filesPanel.hidden = false;
    await refreshFiles();
    if (filesList.options.length === 0) {
      filesHead.textContent = 'No received files yet — drop one above.';
      filesList.hidden = true; filesSet.hidden = true; filesNote.textContent = '';
      return;
    }
    filesHead.textContent = 'Choose the file Peter should read:';
    filesList.hidden = false; filesSet.hidden = false;
    const firstSel = filesList.selectedOptions[0];
    filesNote.textContent = firstSel ? 'Tap "Set active →" to save: ' + firstSel.textContent : 'Pick a file, then tap "Set active →".';
  } else { filesPanel.hidden = true; }
});
filesSet.addEventListener('click', async () => {
  const sel = filesList.selectedOptions[0];
  if (!sel) return;
  const r = await window.pywebview.api.files_set_active(sel.value);
  if (r && r.ok) { await refreshFiles(); showActiveFile({ active: sel.value }); filesNote.textContent = 'Active file set: ' + sel.value + '  (say "talk about my file" to Peter)'; }
  else { filesNote.textContent = 'Could not set that file as active.'; }
});
filesList.addEventListener('change', () => { const sel = filesList.selectedOptions[0]; if (sel) filesNote.textContent = 'Tap "Set active →" to save: ' + sel.textContent; });

const chatLog = $('chatLog');
function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function linkify(text) {
  return escapeHtml(text).replace(/((?:https?:\/\/|www\.)[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function appendMsg(text) {
  if (!text || !text.trim()) return;
  const wrap = document.createElement('div');
  wrap.className = 'msg peter';
  const whoEl = document.createElement('div'); whoEl.className = 'who'; whoEl.textContent = 'PETER';
  const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.innerHTML = linkify(text);
  wrap.appendChild(whoEl); wrap.appendChild(bubble);
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
}

// ── Task bar — driven by "peter-status" data-channel messages broadcast
// from agent.py (agent_state_changed / tool_execution_updated). ──
const taskbar = $('taskbar'), taskbarLabel = $('taskbarLabel'), taskProgress = $('taskProgress');
const taskProgressFill = taskProgress.querySelector('i');
let progressWatchdog = null, progressHideTimer = null, progressPct = 0, toolStepsThisTurn = 0;
function setTaskbar(isActive, label) {
  taskbar.classList.toggle('active', !!isActive);
  if (label) taskbarLabel.textContent = label;
}
function setProgressPct(pct) {
  progressPct = Math.max(0, Math.min(100, pct));
  taskProgressFill.style.width = progressPct + '%';
}
// Real, event-driven progress (not a fake indeterminate loop): each stage of
// Peter's work — thinking, each tool call, each tool finishing, speaking the
// answer — pushes the green bar forward, so it actually reflects how far
// along the current task is.
function showTaskProgress(on, pct) {
  taskProgress.classList.toggle('show', !!on);
  clearTimeout(progressWatchdog);
  clearTimeout(progressHideTimer);
  if (on) {
    if (typeof pct === 'number') setProgressPct(pct);
    // Safety net: if a follow-up status update never arrives (dropped
    // message, swallowed tool error, etc.) the bar shouldn't spin forever.
    progressWatchdog = setTimeout(() => { taskProgress.classList.remove('show'); setProgressPct(0); }, 25000);
  } else {
    // Let the opacity fade play, then reset the fill so the next task starts from empty.
    progressHideTimer = setTimeout(() => setProgressPct(0), 220);
  }
}
function handlePeterStatus(msg) {
  const state = msg.state;
  if (state === 'thinking') {
    toolStepsThisTurn = 0;
    showTaskProgress(true, 20);
    setTaskbar(true, 'Thinking…');
  } else if (state === 'tool') {
    toolStepsThisTurn += 1;
    showTaskProgress(true, Math.min(85, 40 + toolStepsThisTurn * 15));
    setTaskbar(true, msg.label || 'Working…');
  } else if (state === 'tool_done') {
    setProgressPct(Math.min(92, progressPct + 5));
  } else if (state === 'speaking') {
    showTaskProgress(true, 100);
    setTaskbar(true, 'Speaking…');
    progressHideTimer = setTimeout(() => showTaskProgress(false), 500);
  } else if (state === 'listening') {
    showTaskProgress(false);
    setTaskbar(false, 'Listening…');
  } else {
    showTaskProgress(false);
    setTaskbar(false, 'Ready to help!');
  }
}

// ── File / link cards — driven by "peter-files" data-channel messages. ──
function toFileUrl(p) {
  if (!p) return '';
  let s = p.replace(/\\/g, '/');
  if (!s.startsWith('/')) s = '/' + s;
  return 'file://' + encodeURI(s);
}
function appendFileCard(d) {
  const wrap = document.createElement('div'); wrap.className = 'msg peter';
  const whoEl = document.createElement('div'); whoEl.className = 'who'; whoEl.textContent = 'PETER';
  const bubble = document.createElement('div'); bubble.className = 'bubble file-card';
  const head = document.createElement('div'); head.className = 'file-card-head'; head.textContent = 'Designed: ' + d.name;
  bubble.appendChild(head);
  if (d.png) {
    const img = document.createElement('img'); img.className = 'file-card-preview'; img.src = toFileUrl(d.png); img.alt = d.name;
    bubble.appendChild(img);
  }
  const sub = document.createElement('div'); sub.className = 'file-card-sub';
  const parts = [];
  if (d.stl) parts.push('STL ready');
  if (d.scad) parts.push('SCAD source');
  sub.textContent = parts.join(' · ') || 'Files saved';
  bubble.appendChild(sub);
  const actions = document.createElement('div'); actions.className = 'file-card-actions';
  if (d.stl) {
    const b = document.createElement('button'); b.className = 'fc-btn'; b.textContent = 'Open STL';
    b.addEventListener('click', () => window.pywebview.api.open_cad_design(d.name, 'stl'));
    actions.appendChild(b);
  }
  const rb = document.createElement('button'); rb.className = 'fc-btn secondary'; rb.textContent = 'Show in folder';
  rb.addEventListener('click', () => window.pywebview.api.reveal_cad_design(d.name));
  actions.appendChild(rb);
  bubble.appendChild(actions);
  wrap.appendChild(whoEl); wrap.appendChild(bubble);
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
}
function appendLinkList(links) {
  if (!links || !links.length) return;
  const wrap = document.createElement('div'); wrap.className = 'msg peter';
  const whoEl = document.createElement('div'); whoEl.className = 'who'; whoEl.textContent = 'LINKS';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  const list = document.createElement('div'); list.className = 'link-list';
  links.forEach((l) => {
    const a = document.createElement('a'); a.className = 'link-item'; a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = l.title || l.url;
    list.appendChild(a);
  });
  bubble.appendChild(list);
  wrap.appendChild(whoEl); wrap.appendChild(bubble);
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
}
function appendResultCard(d) {
  const wrap = document.createElement('div'); wrap.className = 'msg peter';
  const whoEl = document.createElement('div'); whoEl.className = 'who'; whoEl.textContent = 'PETER';
  const bubble = document.createElement('div'); bubble.className = 'bubble result-card';
  if (d.title) {
    const head = document.createElement('div'); head.className = 'result-card-head'; head.textContent = d.title;
    bubble.appendChild(head);
  }
  const body = document.createElement('div'); body.innerHTML = linkify(d.text || '');
  bubble.appendChild(body);
  wrap.appendChild(whoEl); wrap.appendChild(bubble);
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
}
function handlePeterFiles(msg) {
  if (msg.type === 'cad_design') appendFileCard(msg);
  else if (msg.type === 'search_links') appendLinkList(msg.links);
  else if (msg.type === 'chat_message') appendResultCard(msg);
  else if (msg.type === 'calendar_updated') { if (!agendaOverlay.hidden) renderAgendaMonth(); }
}

function handleDataReceived(payload, participant, kind, topic) {
  // kind is livekit-client's DataPacket_Kind enum — a NUMBER (RELIABLE=0,
  // LOSSY=1), never the string 'reliable'. Comparing against the string
  // silently dropped every single data-channel message (chat, status bar,
  // file cards, search links) since agent.py always publishes reliable=True.
  if (kind !== LivekitClient.DataPacket_Kind.RELIABLE) return;
  try {
    const msg = JSON.parse(new TextDecoder().decode(payload));
    if (topic === 'peter-status' && msg && msg.state) { handlePeterStatus(msg); return; }
    if (topic === 'peter-files' && msg && msg.type) { handlePeterFiles(msg); return; }
    if (topic === 'peter-control' && msg && msg.type === 'close_app') {
      try { window.pywebview.api.close_window(); } catch (err) { console.error(err); }
      return;
    }
    if (msg && msg.transcriptions && Array.isArray(msg.transcriptions)) {
      for (const t of msg.transcriptions) {
        if (!t || !t.text) continue;
        if (t.participant) continue;
        appendMsg(t.text.trim());
      }
    }
  } catch (e) { }
}

$('btnMinimize').addEventListener('click', (e) => { e.stopPropagation(); try { window.pywebview.api.minimize_window(); } catch (err) { console.error(err); } });
$('btnClose').addEventListener('click', (e) => { e.stopPropagation(); try { window.pywebview.api.close_window(); } catch (err) { console.error(err); } });

window.addEventListener('pywebviewready', () => {
  clientLog('pywebviewready fired — page is live');
  loadConnectionInfo();
  loadUrl();
  loadSpotify();
  refreshFiles();
  // Small head start so peter_app.py's native mic-permission-grant hook
  // (attached on its own window "loaded" event) is never raced by this
  // page's very first getUserMedia call — startClapListener() retries with
  // backoff on failure anyway, but this avoids the first attempt failing.
  setTimeout(() => startClapListener(), 600);
});
</script>
